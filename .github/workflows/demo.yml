name: Demo GIF

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/demo.tape

      - uses: actions/upload-artifact@v4
        with:
          name: netriskscan-demo
          path: demo/netriskscan-demo.gif
